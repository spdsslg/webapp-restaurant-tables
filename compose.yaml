services:
  web:
    build: .
    ports:
      - "127.0.0.1:8000:5000"
    environment:
      FLASK_RESTAURANT_NAME: "${FLASK_RESTAURANT_NAME:-Restaurant}"
    volumes:
      - ./app:/app/app:ro
      - ./tests:/app/tests:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
